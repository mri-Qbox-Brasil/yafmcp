name: Publish

# Dispara ao publicar uma release no GitHub (ou na mão, pela aba Actions).
# Segredos necessários:
#   NPM_TOKEN — token de automação do npmjs.com, para o pacote público `yafmcp`
# O GitHub Packages usa o GITHUB_TOKEN do próprio job, sem segredo extra.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npmjs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://npm.pkg.github.com
          cache: npm
      - run: npm ci
      # O GitHub Packages só aceita pacote com escopo do dono do repositório;
      # o nome publicado lá é @<owner>/yafmcp, o mesmo código do npmjs.
      # Escopo npm não aceita maiúscula (o dono é mri-Qbox-Brasil): vai minúsculo.
      - run: |
          owner="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"
          npm pkg set name="@${owner}/yafmcp"
          echo "@${owner}:registry=https://npm.pkg.github.com" >> .npmrc
        env:
          OWNER: ${{ github.repository_owner }}
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
